# KAI-9000 Workflow 1: Утренний Крипто-Брифинг
# Trigger: Cron 08:00 ежедневно
# Output: vault/01-Daily/{{date}}_crypto_brief.md + Telegram уведомление

id: kai-morning-crypto-brief
name: "KAI-9000 Утренний Крипто-Брифинг"
trigger:
  type: cron
  schedule: "0 8 * * *"

nodes:
  - id: fetch_sources
    type: action
    tool: "memory.auto_fetch"
    description: "Сбор данных из Gmail, Slack, Telegram, Binance, Polymarket, Notion, Google Calendar за последние 24 часа"
    
  - id: crypto_health_check
    type: agent
    skill: "crypto-portfolio-monitor"
    description: "Проверка aUSDT peg, XAUt peg, XLM_PERP margin status"
    inputs:
      assets:
        - { symbol: "aUSDT", peg: 1.00, tolerance: 0.005, source: "binance-mcp" }
        - { symbol: "XAUt", peg: "gold_spot", tolerance: 0.02, source: "binance-mcp" }
        - { symbol: "XLM_PERP", margin_floor: 0.15, source: "whitebit_api" }
    
  - id: classify_triage
    type: agent
    description: "Классификация входящих по 4 категориям"
    inputs:
      categories:
        - urgent_trade: "Требует действия в течение 2 часов (depeg, margin critical, large movement)"
        - margin_alert: "Маржинальная позиция требует пополнения или сокращения"
        - meeting: "Запланированные встречи с досье участников"
        - info: "Информационные обновления для архива"

  - id: generate_briefing
    type: agent
    description: "Генерация Markdown-брифинга"
    template: |
      # KAI-9000 Утренний Брифинг — {{date}}
      
      ## 📊 Портфель: {{portfolio_status}}
      | Актив | Цена | Peg | Статус |
      |:---|:---|:---|:---|
      | aUSDT | ${{price}} | $1.00 | {{status}} |
      | XAUt | ${{price}} | {{gold_spot}} | {{status}} |
      | XLM_PERP | Margin {{margin}}% | — | {{status}} |
      
      ## 🔴 Срочное ({{urgent_count}})
      {{urgent_items}}
      
      ## 📅 Встречи ({{meetings_count}})
      {{meetings}}
      
      ## ℹ️ Информационное
      {{info_items}}
      
      ## ✅ Рекомендованные действия
      {{actions}}

  - id: compress
    type: action
    tool: "tokenjuice.compress"
    ratio: 0.1
    
  - id: save_obsidian
    type: action
    tool: "filesystem.write_file"
    path: "~/.kai9000/vault/01-Daily/{{date}}_crypto_brief.md"
    content: "{{generated_briefing}}"
    
  - id: update_memory
    type: action
    tool: "memory_store"
    key: "daily_briefing_{{date}}"
    content: "Portfolio: {{portfolio_status}}, Urgent: {{urgent_count}}, Meetings: {{meetings_count}}"

  - id: notify_telegram
    type: notification
    channel: "telegram"
    summary: |
      KAI-9000 Брифинг: {{portfolio_status}} | {{urgent_count}} срочных | {{meetings_count}} встреч | {{margin_alert_count}} маржин-алертов
    full_digest: "{{generated_briefing}}"
    priority: "{{portfolio_status == 'RED' ? 'high' : 'normal'}}"
