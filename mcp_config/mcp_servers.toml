# KAI-9000 MCP CONFIGURATION v2.0.0 — 12 Servers
# Sovereign Architect Edition

[mcp_client]
enabled = true

# === FILESYSTEM ===
[[mcp_client.servers]]
name = "local-filesystem"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/storage/emulated/0/", "/data/data/com.termux/files/home/.kai9000"]

# === GITHUB ===
[[mcp_client.servers]]
name = "github-mcp"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "YOUR_GITHUB_TOKEN" }

# === SQLITE (Memory Tree) ===
[[mcp_client.servers]]
name = "sqlite-mcp"
command = "uvx"
args = ["mcp-server-sqlite", "--db-path", "/data/data/com.termux/files/home/.kai9000/memory.db"]

# === BRAVE SEARCH ===
[[mcp_client.servers]]
name = "web-research-mcp"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-brave-search"]
env = { BRAVE_API_KEY = "YOUR_BRAVE_KEY" }

# === NOTION ===
[[mcp_client.servers]]
name = "notion-mcp"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-notion"]
env = { NOTION_API_KEY = "YOUR_NOTION_KEY" }

# === GOOGLE AI ===
[[mcp_client.servers]]
name = "google-ai-mcp"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-googleai"]
env = { GOOGLE_AI_API_KEY = "YOUR_GOOGLE_AI_KEY" }

# === BINANCE ===
[[mcp_client.servers]]
name = "binance-mcp"
command = "python3"
args = ["-m", "kai9000_binance_server"]

# === POLYMARKET ===
[[mcp_client.servers]]
name = "polymarket-mcp"
command = "python3"
args = ["-m", "kai9000_polymarket_server"]

# === ASANA (NEW in v2.0) ===
[[mcp_client.servers]]
name = "asana"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-asana"]
env = { ASANA_ACCESS_TOKEN = "YOUR_ASANA_TOKEN" }

# === GMAIL (NEW in v2.0) ===
[[mcp_client.servers]]
name = "gmail"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-gmail"]
env = { GMAIL_CREDENTIALS = "YOUR_GMAIL_CREDENTIALS" }

# === META MARKETING (NEW in v2.0) ===
[[mcp_client.servers]]
name = "meta-marketing"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-meta-marketing"]
env = { META_ACCESS_TOKEN = "YOUR_META_TOKEN", META_AD_ACCOUNT_ID = "YOUR_AD_ACCOUNT_ID" }

# === GOOGLE WORKSPACE (NEW in v2.0) ===
[[mcp_client.servers]]
name = "google-workspace"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-google-workspace"]
env = { GWS_CREDENTIALS = "YOUR_GWS_CREDENTIALS" }
